name: dbt_lambda
version: "1.0.0"
config-version: 2
profile: dbt_lambda

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

vars:
  anp_mensal_inicio: '2023-01-01'        # first month the ANP publishes monthly files (closed months need one)
  # price quality gate: a price is suspicious outside [min, max] x median of its month x product x UF.
  # Measured 2026-11-08 on 31.6 M rows: [0.5, 2.0] flags 3 rows; a R$ 99 litre of gasoline is ~15x the median.
  anp_preco_suspeito_fator_min: 0.5
  anp_preco_suspeito_fator_max: 2.0
  anp_silver_recencia_dias: 21           # newest collection older than this: the weekly files stopped arriving
  # quality gate per batch (dq_anp__qualidade_lote): only the recent months are judged, history stays visible
  anp_gate_janela_meses: 3
  anp_gate_var_mediana_max_pct: 15       # month-on-month change of the median price per product
  anp_gate_queda_postos_max_pct: 30      # drop of surveyed stations vs the previous month
  anp_gate_suspeito_max_share: 0.001     # share of suspicious prices in a batch
  anp_semanal_max_dias: 21               # newest weekly file older than this: the 4-week window is about to lose data
  anp_gold_atual_meses: 18               # ag_preco_posto_atual: last price searched in this many months

models:
  dbt_lambda:
    # read-only roles (infra/postgres/anp_dbt_grants.sql creates the schemas, USAGE and default privileges)
    +grants:
      select: ['dbeaver_ro', 'grafana_ro']
    silver:
      +schema: anp_silver
      +materialized: view
      +tags: ['anp', 'silver']
    observability:
      +schema: anp_dq
      +materialized: table
      +tags: ['anp', 'dq']
    gold:
      +schema: anp_gold
      +materialized: table
      +tags: ['anp', 'gold']
  # Elementary (package): every dbt invocation (each Cosmos task included) records its run and test results here;
  # Grafana reads them. Create/upgrade the tables with `dbt run -s elementary` (not part of the anp_dbt DAG).
  elementary:
    +schema: anp_elementary
    +grants:
      select: ['dbeaver_ro', 'grafana_ro']

seeds:
  dbt_lambda:
    +schema: anp_ref
    +grants:
      select: ['dbeaver_ro', 'grafana_ro']
    anp_produto_grupo:
      +column_types:
        produto: text
        product_group: text
        unidade_medida: text
        ordem: integer
