# /etc/grafana/provisioning/dashboards/lambda4.yaml — dashboards generated by infra/grafana/build_dashboards.py
apiVersion: 1
providers:
  - name: lambda4
    folder: "Lambda4"
    type: file
    disableDeletion: false
    allowUiUpdates: false        # source of truth is the repository: edit the builder, not the UI
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards-lambda4
